<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Nizay client</title>
<style>
:root{--bg:#0b0b0d;--side:#0c0c0f;--card:#131316;--card2:#18181c;--line:#26262b;--txt:#f0f0f5;--dim:#8a8a94;--dimmer:#55555e;--white:#ededf2;--dark:#0b0b0d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:Inter,"Segoe UI",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{display:grid;grid-template-rows:56px 1fr;height:100%;border:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);-webkit-app-region:drag}
.top *{-webkit-app-region:no-drag}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(#1d1d21,#0f0f12);border:1px solid var(--line);display:grid;place-items:center}
.brand{font-weight:600;font-size:16px}.brand span{color:var(--dim);font-weight:400}
.sp{flex:1}
.pill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;color:#cfcfd6;background:#0f0f12}
.dot{width:6px;height:6px;border-radius:50%;background:var(--white)}
.wbtn{width:36px;height:30px;border:1px solid var(--line);border-radius:8px;background:#121216;display:grid;place-items:center}
.wbtn:hover{background:#1a1a1f}
.body{display:grid;grid-template-columns:224px 1fr;min-height:0}
.side{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column}
.cap{font-size:10px;letter-spacing:.22em;color:var(--dimmer);padding:0 12px 14px}
.nav{display:flex;align-items:center;gap:14px;padding:0 14px;height:44px;border-radius:12px;color:var(--dim);font-size:15px;margin-bottom:6px;position:relative;border:1px solid transparent;width:100%;text-align:left}
.nav:hover{color:var(--txt)}
.nav.on{background:#17171b;border-color:var(--line);color:var(--txt);font-weight:500}
.nav.on:before{content:"";position:absolute;left:-12px;top:12px;width:3px;height:20px;border-radius:2px;background:var(--white)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.me{margin-top:auto;display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.av{width:30px;height:30px;border-radius:8px;background:linear-gradient(#2a2a30,#141417);display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}
.me b{display:block;font-size:14px;font-weight:600}.me small{color:var(--dim);font-size:12px}
.main{padding:20px 32px;overflow:auto;position:relative}
h1{font-size:30px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:15px;margin:2px 0 18px}
.hero{position:relative;border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,#121215,#0e0e11);padding:28px 32px;height:285px;overflow:hidden;
 background-image:radial-gradient(#1c1c20 1px,transparent 1.2px),linear-gradient(180deg,#121215,#0e0e11);background-size:22px 22px,100% 100%}
.hero .bgN{position:absolute;right:-70px;top:-10px;opacity:.55}
.tag{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:#c7c7ce;background:#0f0f12}
.hero h2{font-size:56px;font-weight:700;letter-spacing:-.02em;margin:22px 0 4px;line-height:1.1}
.meta{color:var(--dim);font-size:18px}.meta i{margin:0 10px;font-style:normal}
.row{display:flex;gap:20px;margin-top:30px}
.play{background:var(--white);color:#0b0b0d;border-radius:20px;height:56px;width:220px;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:14px;transition:.15s}
.play:hover{transform:translateY(-1px) scale(1.04);box-shadow:0 0 40px rgba(237,237,242,.18)}
.play[disabled]{opacity:.6;cursor:default;transform:none;box-shadow:none}
.ghost{border:1px solid var(--line);background:#15151a;border-radius:18px;height:56px;padding:0 28px;display:flex;align-items:center;gap:12px;font-size:18px}
.ghost:hover{background:#1b1b21}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.stat{border:1px solid var(--line);border-radius:18px;background:#101013;padding:16px 18px}
.stat small{color:var(--dim);font-size:14px}.stat b{display:block;font-size:22px;font-weight:600;margin-top:4px}
.foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:20px}
.ok{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:15px}.ok .dot{background:#6b6b74}
.sel label{display:block;color:var(--dim);font-size:14px;margin-bottom:6px}
.select{width:332px;height:52px;border:1px solid var(--line);border-radius:16px;background:#0f0f12;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:18px}
.chip{background:#1b1b20;border-radius:999px;padding:4px 12px;font-size:14px;color:#cfcfd6;margin-left:14px}
.btns{display:flex;gap:10px}
.btn{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:0 22px;height:44px;font-size:16px}
.btn.p{background:var(--white);color:#0b0b0d;border-color:var(--white);font-weight:600}
.btn:hover{filter:brightness(1.15)}
.card{border:1px solid var(--line);border-radius:22px;background:#111114;padding:20px 24px;margin-bottom:14px}
.card h3{font-size:19px;font-weight:600}.card p{color:var(--dim);font-size:14px;margin-top:2px}
.chead{display:flex;justify-content:space-between;align-items:flex-start}
.badge{border:1px solid var(--line);border-radius:10px;background:#18181c;padding:6px 16px;font-size:16px;font-weight:600}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:linear-gradient(to right,var(--white) var(--p,25%),#1f1f24 var(--p,25%));margin:20px 0 8px;outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--white);border:5px solid #0b0b0d;box-shadow:0 0 0 2px var(--white)}
.ticks{display:flex;justify-content:space-between;color:var(--dimmer);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.field small{display:block;color:var(--dim);font-size:15px;margin-bottom:10px}
.field input[type=text]{width:100%;height:46px;border:1px solid var(--line);border-radius:14px;background:#0c0c0f;padding:0 18px;font-size:17px;color:var(--txt);-webkit-user-select:text;user-select:text;outline:0}
.tgl{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #1a1a1e}.tgl:last-child{border:0}
.tgl b{font-weight:500;font-size:18px;display:block}.tgl small{color:var(--dim);font-size:14px}
.sw{width:52px;height:28px;border-radius:14px;border:1px solid var(--line);background:#1b1b20;position:relative;flex:none}
.sw:after{content:"";position:absolute;left:4px;top:4px;width:18px;height:18px;border-radius:50%;background:#7a7a84;transition:.15s}
.sw.on{background:var(--white);border-color:var(--white)}.sw.on:after{left:28px;background:#0b0b0d}
.bar{display:flex;justify-content:flex-end;gap:14px;margin-top:6px}
.acc{display:flex;align-items:center;gap:16px;border:1px solid var(--line);border-radius:20px;background:#111114;padding:14px 18px;margin-bottom:12px}
.acc .av{width:44px;height:44px;font-size:20px;border-radius:12px}
.acc .nm{flex:1}.acc .nm b{font-size:20px;font-weight:600}.acc .nm small{display:block;color:var(--dim);font-size:15px;margin-top:3px}
.type{background:#1b1b20;border-radius:999px;padding:3px 12px;font-size:14px;color:#cfcfd6;margin-left:12px;font-weight:400}
.tabs{display:flex;gap:6px;border:1px solid var(--line);border-radius:14px;padding:6px;background:#0f0f12}
.tab{padding:8px 18px;border-radius:10px;color:var(--dim);font-size:16px}.tab.on{background:#1a1a1f;color:var(--txt);font-weight:600}
.search{flex:1;margin-left:28px;border:1px solid var(--line);border-radius:14px;background:#0f0f12;display:flex;align-items:center;padding:0 16px;gap:10px;color:var(--dim)}
.search input{background:none;border:0;outline:0;color:var(--txt);font-size:16px;flex:1;-webkit-user-select:text;user-select:text}
.info-h{display:flex;gap:28px;align-items:center}
.big{width:84px;height:84px;border-radius:24px;background:linear-gradient(#1d1d21,#0f0f12);border:1px solid var(--line);display:grid;place-items:center}
.chips{display:flex;gap:10px;margin-top:12px}.chips span{border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:15px;background:#18181c}
.tl{margin-top:14px}.tl div{padding:10px 0 10px 22px;position:relative}.tl div:before{content:"";position:absolute;left:0;top:18px;width:9px;height:9px;border-radius:50%;background:#34343a}
.tl div:first-child:before{background:var(--white)}.tl b{font-weight:600}.tl span{color:var(--dim);margin-left:10px}.tl small{display:block;color:var(--dim);margin-top:4px;font-size:15px}
.link{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:10px;background:#101013;font-size:18px;width:100%}
.link:hover{background:#17171b}
#mod{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:10}
.dlg{width:440px;border:1px solid var(--line);border-radius:22px;background:#111114;padding:24px}
.dlg h3{font-size:22px;margin-bottom:4px}.dlg p{color:var(--dim);font-size:14px;margin-bottom:16px}
.dlg input{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:#0c0c0f;padding:0 18px;font-size:18px;color:var(--txt);outline:0;-webkit-user-select:text;user-select:text}
.dlg input:focus{border-color:#4a4a54}
.err{color:#ff8a8a;font-size:14px;min-height:20px;margin:8px 0 0}.uuid{color:var(--dimmer);font-size:13px;min-height:18px;margin:2px 0 14px;font-family:ui-monospace,Consolas,monospace}
.dlg .btns{justify-content:flex-end}
#log{display:none;position:absolute;left:32px;right:32px;bottom:18px;height:120px;background:#0a0a0c;border:1px solid var(--line);border-radius:14px;padding:10px 14px;overflow:auto;font:12px ui-monospace,Consolas,monospace;color:#9a9aa4;-webkit-user-select:text;user-select:text;white-space:pre-wrap}
*::-webkit-scrollbar{display:none;width:0;height:0}*{scrollbar-width:none}
.hero>*:not(.bgN){position:relative;z-index:1}
.hero .bgN{pointer-events:none;z-index:0}
.errline{color:#ff8a8a;font-size:13px;margin:12px 4px 0;min-height:18px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 16V4M4 4l12 12M16 16V4" stroke="#ededf2" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="brand">Nizay <span>client</span></div>
    <div class="sp"></div>
    <div class="pill"><i class="dot"></i>Client v0.3.0</div>
    <button class="wbtn" id="min"><svg width="14" height="14"><path d="M1 7h12" stroke="#ededf2" stroke-width="1.6"/></svg></button>
    <button class="wbtn" id="cls"><svg width="14" height="14"><path d="M2 2l10 10M12 2L2 12" stroke="#ededf2" stroke-width="1.6"/></svg></button>
  </div>
  <div class="body">
    <aside class="side">
      <div class="cap">МЕНЮ</div>
      <div id="nav"></div>
      <div class="me"><div class="av" id="meAv">S</div><div><b id="meName">Steve_01</b><small id="meType">Offline</small></div></div>
    </aside>
    <main class="main" id="main"></main>
  </div>
</div>
<script>
const I = {
  home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>',
  user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>',
  gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.4"/><circle cx="12" cy="12" r="6.4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>',
  info:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
  arrow:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#8a8a94" stroke-width="1.5"><path d="M4 12L12 4M5 4h7v7"/></svg>',
  trash:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a8a94" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>',
  folder:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ededf2" stroke-width="1.6" stroke-linejoin="round"><path d="M3 6h7l2 2h9v11H3z"/></svg>',
};
const PAGES=[['home','Главная',I.home],['acc','Аккаунты',I.user],['fr','Друзья',I.user],['set','Настройки',I.gear],['info','Информация',I.info]];
let modal=false, S=null, page='home', tab='all', q='', status='ready', log='', statusText='', errText='';

const sw=(k)=>`<button class="sw ${S[k]?'on':''}" data-k="${k}"></button>`;
const rel=(a)=>{ if(!a.lastTs) return a.last||'никогда'; const d=Date.now()-a.lastTs, m=Math.floor(d/60000);
  if(m<1) return 'сейчас'; if(m<60) return m+' мин назад'; const h=Math.floor(m/60); if(h<24) return h+' ч назад';
  const dd=Math.floor(h/24); return dd+' дн. назад'; };
const fmt=(m)=>`${Math.floor(m/60)} ч ${m%60} мин`;
const lastLaunch=()=>{ if(!S.lastLaunch) return 'Сегодня, 21:40'; const d=new Date(S.lastLaunch); return 'Сегодня, '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); };
const bigN='<svg width="280" height="400" viewBox="0 0 280 400"><g stroke="#1d1d21" stroke-width="44" stroke-linecap="round" fill="none"><path d="M30 20V380M30 20L250 380M250 20V380"/></g></svg>';

function nav(){
  document.getElementById('nav').innerHTML=PAGES.map(([id,t,ic])=>`<button class="nav ${page===id?'on':''}" data-p="${id}">${ic}${t}</button>`).join('');
  const a=S.accounts.find(x=>x.name===S.activeAccount)||S.accounts[0];
  meAv.textContent=a.name[0].toUpperCase(); meName.textContent=a.name; meType.textContent=a.type;
}

function home(){
  const label={ready:'Готов к запуску',preparing:'Подготовка файлов…',launching:'Запуск…',running:'Игра запущена'}[status]||'Готов к запуску';
  return `<h1>Главная</h1><div class="sub">Запуск клиента и выбор версии</div>
  <div class="hero"><div class="bgN">${bigN}</div>
    <span class="tag"><i class="dot"></i>${statusText&&status!=='ready'?statusText:label}</span>
    <h2>Nizay client</h2>
    <div class="meta">Fabric<i>·</i>Minecraft 1.21.11<i>·</i>Java 21</div>
    <div class="row"><button class="play" id="play" ${status!=='ready'?'disabled':''}><svg width="18" height="20" viewBox="0 0 18 20"><path d="M2 1l14 9L2 19z" fill="#0b0b0d"/></svg>Запуск</button>
    <button class="ghost" id="folder">${I.folder}Папка игры</button></div></div>
  <div class="stats">
    <div class="stat"><small>Последний запуск</small><b>${lastLaunch()}</b></div>
    <div class="stat"><small>Время в игре</small><b>${fmt(S.playtimeMin)}</b></div>
    <div class="stat"><small>Сборка клиента</small><b>0.1.0 (стабильная)</b></div></div>
  <div class="foot"><div class="ok"><i class="dot"></i>Клиент актуален</div>
    <div class="sel"><label>Версия Minecraft</label><div class="select"><span>1.21.11<span class="chip">Fabric</span></span><svg width="16" height="16" fill="none" stroke="#ededf2" stroke-width="1.6"><path d="M3 6l5 5 5-5"/></svg></div></div></div>
  <div class="errline" id="err">${errText}</div>
  <div id="log"></div>`;
}

function acc(){
  const list=S.accounts.filter(a=>(tab==='all'||a.type===tab)&&a.name.toLowerCase().includes(q.toLowerCase()));
  const c=(t)=>t==='all'?S.accounts.length:S.accounts.filter(a=>a.type===t).length;
  return `<div style="display:flex;justify-content:space-between"><div><h1>Аккаунты</h1><div class="sub">Менеджер аккаунтов · ${S.accounts.length}</div></div>
    <div class="btns"><button class="btn p" id="addMs">+ Microsoft</button><button class="btn" id="addOff">+ Offline</button></div></div>
  <div style="display:flex;margin-bottom:16px"><div class="tabs">
    <button class="tab ${tab==='all'?'on':''}" data-t="all">Все ${c('all')}</button><button class="tab ${tab==='Microsoft'?'on':''}" data-t="Microsoft">Microsoft ${c('Microsoft')}</button><button class="tab ${tab==='Offline'?'on':''}" data-t="Offline">Offline ${c('Offline')}</button></div>
    <div class="search">⌕<input id="q" placeholder="Поиск аккаунта" value="${q}"></div></div>
  ${list.map(a=>`<div class="acc"><div class="av">${a.name[0].toUpperCase()}</div><div class="nm"><b>${a.name}<span class="type">${a.type}</span></b><small>Последний вход: ${rel(a)}${a.uuid?` · <span style="font-family:ui-monospace,Consolas,monospace;font-size:13px">${a.uuid.slice(0,8)}…</span>`:''}</small></div>
    ${a.name===S.activeAccount?'<button class="btn" style="border-color:#3a3a42">✓ Активен</button>':`<button class="btn" data-sel="${a.name}">Выбрать</button>`}
    <button class="btn" style="padding:0 12px" data-del="${a.name}">${I.trash}</button></div>`).join('')}
  <button class="link" id="addAny" style="justify-content:center;color:var(--dim);font-size:17px">+  Добавить аккаунт</button>${modal?modalHtml():''}`;
}

function modalHtml(){
  return `<div id="mod"><div class="dlg"><h3>Offline-аккаунт</h3><p>Введите ник. UUID создаётся автоматически по тому же алгоритму, что и в оригинальном клиенте.</p>
  <input id="nick" maxlength="16" placeholder="Например, Steve_01" autocomplete="off" spellcheck="false">
  <div class="err" id="nickErr"></div>
  <div class="btns"><button class="btn" id="mRand" style="margin-right:auto">Случайный ник</button><button class="btn" id="mCancel">Отмена</button><button class="btn p" id="mOk">Добавить</button></div></div></div>`; }
const NICK=/^[A-Za-z0-9_]{3,16}$/;
function openModal(){ modal=true; render(); const i=document.getElementById('nick'); if(i) i.focus(); }
async function submitNick(){
  const v=document.getElementById('nick').value.trim();
  if(!NICK.test(v)){ document.getElementById('nickErr').textContent='Ник: 3–16 символов, латиница, цифры и _'; return; }
  const r=await window.nizay.addOffline(v);
  if(r.error){ document.getElementById('nickErr').textContent=r.error; return; }
  S=r.state; modal=false; render();
}
function settings(){
  return `<h1>Настройки</h1><div class="sub">Параметры запуска и клиента</div>
  <div class="card"><div class="chead"><div><h3>Память (ОЗУ)</h3><p>Сколько памяти выделять игре</p></div><div class="badge">${S.ramGb} ГБ</div></div>
    <input type="range" id="ram" min="1" max="16" step="1" value="${S.ramGb}" style="--p:${(S.ramGb-1)/15*100}%"><div class="ticks"><span>1 ГБ</span><span>4 ГБ</span><span>8 ГБ</span><span>12 ГБ</span><span>16 ГБ</span></div></div>
  <div class="card two"><div class="field"><small>Путь к Java</small><input type="text" id="java" value="${S.javaPath||''}" placeholder="Авто (Java 21 скачается сама)"></div>
    <div class="field"><small>Папка игры</small><input type="text" id="dir" value="${S.gameDir}"></div></div>
  <div class="card" style="padding:8px 24px">
    <div class="tgl"><div><b>Закрывать лаунчер после запуска</b><small>Окно скроется, когда игра откроется</small></div>${sw('closeOnLaunch')}</div>
    <div class="tgl"><div><b>Показывать консоль игры</b><small>Полезно для поиска ошибок</small></div>${sw('showConsole')}</div>
    <div class="tgl"><div><b>Автообновление клиента</b><small>Проверять новую версию при старте</small></div>${sw('autoUpdate')}</div></div>
  <div class="bar"><button class="btn" id="reset">Сбросить</button><button class="btn p" id="save">Сохранить</button></div>`;
}

function info(){
  return `<h1>Информация</h1><div class="sub">О клиенте и лаунчере</div>
  <div class="card"><div class="info-h"><div class="big">${'<svg width="46" height="46" viewBox="0 0 20 20"><path d="M4 16V4M4 4l12 12M16 16V4" stroke="#ededf2" stroke-width="2" fill="none" stroke-linecap="round"/></svg>'}</div>
    <div><h2 style="font-size:36px">Nizay client</h2><div class="sub" style="margin:2px 0 0">Минималистичный клиент для Minecraft</div><div class="chips"><span>v0.1.0</span><span>Minecraft 1.21.11</span><span>Fabric</span></div></div></div></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
    <div class="card"><h3>Что нового</h3><div class="tl">
      <div><b>v0.1.0</b><span>Первый релиз</span><small>Лаунчер, меню на Right Shift, базовые визуалы</small></div>
      <div><b>v0.0.9</b><span>Тестовая сборка</span><small>Менеджер аккаунтов, выбор версии</small></div>
      <div><b>v0.0.8</b><span>Прототип</span><small>Тёмная тема и логотип</small></div></div></div>
    <div class="card"><h3>Ссылки</h3>${['Discord','GitHub','Сайт','Поддержка'].map(n=>`<button class="link" data-l="${n}">${n}${I.arrow}</button>`).join('')}</div></div>
  <div class="foot"><div class="ok">© Nizay · Не связано с Mojang и Microsoft</div><button class="btn" id="upd">Проверить обновления</button></div>`;
}

let FR=null, frErr='', frMsg='';
async function frLoad(){ const r=await window.nizay.frState(); S=r.state||S; if(r.error){ frErr=r.error; FR=null; } else { frErr=''; FR=r.data; } if(page==='fr' && !document.activeElement?.matches('input')) render(); }
function friendsPage(){
  const srv=(S.fr&&S.fr.server)||'';
  const head=`<h1>Друзья</h1><div class="sub">Поиск по нику или ID, группа и стрелки в игре</div>
  <div class="card two"><div class="field"><small>Адрес сервера друзей</small><input type="text" id="frsrv" value="${srv}" placeholder="https://ваш-сервер:8787"></div>
  <div class="field"><small>Ваш ID</small><div style="font-size:26px;font-weight:600;padding-top:4px">${FR?FR.me.id:'—'} <span style="font-size:13px;color:var(--dim)">${FR?FR.me.nick:''}</span></div></div></div>
  <div class="bar" style="margin:-6px 0 14px"><button class="btn" id="frsave">Сохранить адрес</button></div>
  <div class="errline">${frErr||frMsg}</div>`;
  if(!FR) return head;
  return head+`<div class="card"><div style="display:flex;gap:10px"><div class="field" style="flex:1"><small>Найти по нику или ID</small><input type="text" id="fradd" placeholder="Ник или ID"></div><button class="btn p" id="fraddbtn" style="align-self:flex-end;height:44px">Добавить в друзья</button></div></div>
  ${FR.invites.length?`<div class="card"><h3>Приглашения в группу</h3>${FR.invites.map(i=>`<div class="acc"><div class="nm"><b>${i.from}</b></div><button class="btn p" data-fracc="${i.from}">Принять</button></div>`).join('')}</div>`:''}
  <div class="card"><h3>Друзья · ${FR.friends.length}</h3>${FR.friends.length?FR.friends.map(f=>`<div class="acc"><div class="av">${f.nick[0].toUpperCase()}</div><div class="nm"><b>${f.nick}<span class="type">#${f.id}</span></b><small>${f.online?'в сети':'не в сети'}</small></div>
    ${f.online?`<button class="btn" data-frinv="${f.nick}">В группу</button>`:''}<button class="btn" style="padding:0 12px" data-frdel="${f.nick}">${I.trash}</button></div>`).join(''):'<small style="color:var(--dim)">Пока никого. Добавьте друга по нику или ID.</small>'}</div>
  <div class="card"><div style="display:flex;justify-content:space-between"><h3>Группа</h3>${FR.group?'<button class="btn" id="frleave">Покинуть</button>':''}</div>
  ${FR.group?FR.group.members.map(m=>`<div class="acc"><div class="nm"><b>${m.nick}</b><small>${m.online?'в сети':'не в сети'}</small></div></div>`).join(''):'<small style="color:var(--dim)">Вы не в группе. В игре друзья из группы видны стрелками на экране.</small>'}</div>`;
}
function render(){
  nav();
  main.innerHTML={home,acc,fr:friendsPage,set:settings,info}[page]();
  if(page==='fr' && !FR && !frErr) frLoad();
  if(S.showConsole && page==='home'){ const l=document.getElementById('log'); if(l){ l.style.display='block'; l.textContent=log; l.scrollTop=1e9; } }
}

document.addEventListener('click',async(e)=>{
  const t=e.target.closest('button,[data-p]'); if(!t) return;
  if(t.dataset.p){ page=t.dataset.p; return render(); }
  if(t.id==='frsave'){ S=await window.nizay.frServer(document.getElementById('frsrv').value); frMsg='Адрес сохранён'; return frLoad(); }
  if(t.id==='fraddbtn'){ const v=document.getElementById('fradd').value.trim(); if(!v) return; const r=await window.nizay.frAdd(v); frMsg=r.error?('Ошибка: '+r.error):('Добавлен: '+r.nick); frErr=''; return frLoad(); }
  if(t.dataset.frinv){ await window.nizay.frInvite(t.dataset.frinv); frMsg='Приглашение отправлено'; return frLoad(); }
  if(t.dataset.fracc){ await window.nizay.frAccept(t.dataset.fracc); return frLoad(); }
  if(t.dataset.frdel){ await window.nizay.frRemove(t.dataset.frdel); return frLoad(); }
  if(t.id==='frleave'){ await window.nizay.frLeave(); return frLoad(); }
  if(t.id==='play'){ window.nizay.launch(); return; }
  if(t.id==='folder') return window.nizay.openFolder();
  if(t.dataset.k){ S[t.dataset.k]=!S[t.dataset.k]; return render(); }
  if(t.dataset.t){ tab=t.dataset.t; return render(); }
  if(t.dataset.sel){ S=await window.nizay.selectAccount(t.dataset.sel); return render(); }
  if(t.dataset.del){ if(!confirm('Удалить аккаунт '+t.dataset.del+'?')) return; S=await window.nizay.removeAccount(t.dataset.del); return render(); }
  if(t.id==='addOff'||t.id==='addAny') return openModal();
  if(t.id==='mCancel'){ modal=false; return render(); }
  if(t.id==='mOk') return submitNick();
  if(t.id==='mRand'){ const i=document.getElementById('nick'); i.value='Player_'+Math.floor(1000+Math.random()*9000); i.focus(); return; }
  if(t.id==='addMs'){ alert('Вход через Microsoft: подключите msmc / @xmcl/user в main.js (метод auth).'); return; }
  if(t.id==='save'){ S.javaPath=document.getElementById('java').value; S.gameDir=document.getElementById('dir').value; await window.nizay.save(S); return; }
  if(t.id==='reset'){ S=await window.nizay.load(); return render(); }
  if(t.dataset.l){ const urls={Discord:'https://discord.gg/',GitHub:'https://github.com/',Сайт:'https://example.com/',Поддержка:'https://example.com/support'}; return window.nizay.openLink(urls[t.dataset.l]); }
});
document.addEventListener('input',(e)=>{
  if(e.target.id==='ram'){ S.ramGb=+e.target.value; e.target.style.setProperty('--p',(S.ramGb-1)/15*100+'%'); e.target.closest('.card').querySelector('.badge').textContent=S.ramGb+' ГБ'; }
  if(e.target.id==='nick'){ const v=e.target.value.trim(); document.getElementById('nickErr').textContent=(v&&!NICK.test(v))?'Ник: 3–16 символов, латиница, цифры и _':''; }
  if(e.target.id==='q'){ q=e.target.value; const pos=q.length; render(); const el=document.getElementById('q'); el.focus(); el.setSelectionRange(pos,pos); }
});
document.addEventListener('keydown',(e)=>{ if(!modal) return; if(e.key==='Enter') submitNick(); if(e.key==='Escape'){ modal=false; render(); } });
min.onclick=()=>window.nizay.minimize(); cls.onclick=()=>window.nizay.close();
window.nizay.onLog((m)=>{ log+=m+'\n'; const l=document.getElementById('log'); if(l&&S.showConsole){ l.textContent=log; l.scrollTop=1e9; } });
window.nizay.onStatus((m)=>{ statusText=m; if(page==='home'){ const t=document.querySelector('.tag'); if(t&&status!=='ready') t.lastChild.textContent=m||''; } });
window.nizay.onError((m)=>{ errText=m; const e=document.getElementById('err'); if(e) e.textContent=m; });
window.nizay.onState((s)=>{ status=s; if(page==='home') render(); });
setInterval(()=>{ if(page==='fr') frLoad(); },4000);
(async()=>{ S=await window.nizay.load(); render(); })();
</script>
</body>
</html>
