name: Build Nizay

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  # Если сборка мода ругается на версию Gradle — поменяйте здесь (см. https://fabricmc.net/develop/)
  GRADLE_VERSION: "9.2.0"

permissions:
  contents: write

jobs:
  mod:
    name: Мод (jar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nizay-mod
          path: build/libs/nizay-client-*.jar
          if-no-files-found: error

  launcher:
    name: Лаунчер (exe)
    runs-on: windows-latest
    needs: mod
    # лаунчер собираем даже если мод не скомпилировался
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: nizay-mod
          path: launcher/mod
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Сборка exe
        working-directory: launcher
        run: |
          npm install
          npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: nizay-launcher
          path: launcher/dist/*.exe
          if-no-files-found: error

  release:
    name: Релиз
    runs-on: ubuntu-latest
    needs: [mod, launcher]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/nizay-launcher/*.exe
            out/nizay-mod/*.jar
